<html>
<head>
<meta http-equiv="Content-Language" content="zh-CN">
<meta charset="UTF-8">
<title>紫微斗数排盘,批量排星,全年段,不限年份</title>
<link rel="stylesheet" type="text/css" href="js/ziwei.css">
	<script type="text/javascript" src="js/sxwnlunar/tools.js"></script><!--工具函数-->
	<script type="text/javascript" src="js/sxwnlunar/eph0.js"></script> <!--天文常数等-->
	<script type="text/javascript" src="js/sxwnlunar/ephB.js"></script> <!--恒星计算(如果不须要恒星,删除此行)-->
	<script type="text/javascript" src="js/sxwnlunar/eph.js"></script>  <!--星历模块-->
	<script type="text/javascript" src="js/sxwnlunar/JW.js"></script>   <!--全国城市经纬数据库及皇帝纪年数据库-->
	<script type="text/javascript" src="js/sxwnlunar/lunar.js"></script><!--日历物件-->
	<script src="js/lunar.js" type="text/javascript"></script>
	<script src="js/ziweistar.js" type="text/javascript"></script>
	<script src="js/ziweicore.js" type="text/javascript"></script>
	<script src="js/ziweiui.js" type="text/javascript"></script>
</head>
<body>
	<div id="container"></div>
	<div id="chartSetBox">
		<details>
			<summary>排盘设置</summary>
			<ul>
				<li><input type="checkbox" name="yue_jie" id="yue_jie" checked="checked" title="不勾选时表示月的分界点为节令"/>不依五星要过节</li>
				<li><input type="checkbox" name="day_23L" id="day_23L" checked="checked" title="不勾选时表示日的分界点为23:00" />日的分界点为00:00</li>
				<li>
					<!--经纬选择--><select id="Sel1" onchange="change(0)"></select> <select id="Sel2" onchange="change2()"></select>
					经度<input id="Cb_J" size=11 type="text" value=0 />纬度<input id="Cb_W" size=9 type="text" value=0 />
					<!--经度纬度--><span id="Cal_zdzb"></span>
				</li>
			</ul>
		</details>
	</div>
	<div><textarea id="timeList" rows="20" cols="140" title="输入西历时间,每行一个;可以用~表示日期范围:开始时间~结束时间[,h]"></textarea></div>
	<div><input id="batchComputeZiWeier" onclick="javascript:batchComputeZiWei()" type="button" value="批量计算" title="在页顶指定男女" /></div>
</body>
</html>
